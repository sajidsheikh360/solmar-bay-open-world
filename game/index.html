<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #top-left { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 3px #000; }
  #health-bar { width: 220px; height: 14px; background: #222; border: 2px solid #fff; border-radius: 3px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #3fa66a; }
  #money { font-size: 22px; font-weight: bold; margin-top: 6px; color: #7dff8a; }
  #top-right { position: absolute; top: 14px; right: 16px; text-align: right; text-shadow: 0 1px 3px #000; }
  #stars { font-size: 26px; letter-spacing: 3px; }
  #clock { font-size: 18px; margin-top: 4px; }
  #speed { font-size: 15px; color: #cfe8ff; }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 560px; text-align: center; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 6px; border-left: 5px solid #ffd23e; }
  #dialogue { position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%); max-width: 620px; text-align: center; font-size: 16px; background: rgba(0,0,0,0.65); padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity 0.4s; }
  #toast { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity 0.4s; color: #ffd23e; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px; border: 3px solid #fff; border-radius: 6px; background: #10141c; }
  #controls { position: absolute; left: 16px; bottom: 16px; font-size: 12px; line-height: 1.6; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px; color: #dfe8ff; }
  #damage-flash { position: fixed; inset: 0; background: #d33a2c; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5, 10, 30, 0.78); color: #fff; text-align: center; z-index: 10; }
  #screen-title { font-size: 64px; letter-spacing: 6px; color: #ffd23e; margin: 0; text-shadow: 0 0 24px #ff2e88; }
  #screen-text { max-width: 640px; font-size: 17px; line-height: 1.6; margin: 18px; }
  #screen button { pointer-events: auto; font-size: 18px; padding: 12px 28px; margin: 6px; border: none; border-radius: 6px; background: #ffd23e; color: #111; font-weight: bold; cursor: pointer; }
  #screen button:hover { background: #ff2e88; color: #fff; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Explore the city on foot and by car, take on missions, and stay out of the police's way."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="damage-flash"></div>
<div id="hud">
  <div id="top-left">
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="money">$250</div>
  </div>
  <div id="top-right">
    <div id="stars">☆☆☆☆☆</div>
    <div id="clock">12:00 Neon Strip</div>
    <div id="speed">On foot</div>
  </div>
  <div id="objective">Solmar Bay</div>
  <div id="dialogue"></div>
  <div id="toast"></div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="controls">WASD move / drive &nbsp;·&nbsp; Mouse drag look &nbsp;·&nbsp; Click shoot &nbsp;·&nbsp; E enter / steal car &nbsp;·&nbsp; F punch &nbsp;·&nbsp; Space brake &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; P pause</div>
</div>
<div id="screen">
  <h1 id="screen-title">SOLMAR BAY</h1>
  <p id="screen-text">Loading…</p>
  <div>
    <button id="start-btn" type="button">Start game</button>
    <button id="continue-btn" type="button" style="display:none">Continue saved game</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
